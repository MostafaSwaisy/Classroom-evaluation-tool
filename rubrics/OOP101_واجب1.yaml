# خصومات ثابتة (تُطبّق على المجموع بعد جمع المعايير)
penalties:
  late_submission: 1

notes: |
  المساق اسمه "برمجة شيئية" لكن محتوى هذا الواجب PHP إجرائي بحت — لا تخصم
  على غياب OOP، غير مطلوب هنا.

  لا أُشغّل كود الطلاب. التقييم بقراءة الكود:
  - Q1–Q9: قابلة للتقييم بالكامل من القراءة.
  - Q10–Q13 (نماذج، $_POST/$_REQUEST، رفع ملفات، file I/O): قيّم صحة البنية
    والمنطق والـ validation. إذا كان لا يمكن الجزم بدون تشغيل، أعطِ الدرجة
    الأعلى المعقولة وضع flag "يحتاج تشغيل للتأكد".

  مستوى مبتدئ — لا تشدّد على جودة الكود المتقدمة (فصل الطبقات، DRY الصارم).
  اخصم فقط على أخطاء فعلية: منطق غلط، نوع بيانات خاطئ، حل ناقص، أو
  عدم تنفيذ ما يطلبه السؤال.

  الأخطاء الشائعة المتوقعة:
  - Q3: استخدام > بدل >= على الحدود (89 أو 79 يقع خارج التقدير)
  - Q5: نسيان continue واستخدام if فقط (يُقبل جزئياً)
  - Q6: طباعة المعدل بدل return
  - Q7: isPrime ترجع true للعدد 1 أو لا تعالج الأعداد <2
  - Q10: لا يوجد تحقق من الحقول الفارغة
  - Q13: لا يوجد تحقق من نوع/حجم الملف
